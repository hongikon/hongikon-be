# api.hongikon.com → Spring Boot 컨테이너(localhost:8080) 리버스 프록시.
# deploy/setup-https.sh 가 /etc/nginx/sites-available/hongikon-api 로 설치하고,
# certbot --nginx 가 이 server 블록에 443 리스너·인증서·http→https 리다이렉트를 덧붙인다.

# IP당 초당 요청 제한. 앱 한 대가 정상적으로 내는 요청(지도·제보·설정)보다 넉넉하게 잡고,
# 무차별 대입·스크래핑만 걸러낸다.
limit_req_zone $binary_remote_addr zone=hongikon_api:10m rate=20r/s;

# 도메인이 아닌 Host(엘라스틱 IP 직접 접속, 위조된 Host)로 온 http 요청은 응답 없이 끊는다.
# 이게 없으면 첫 server 블록이 기본값이 되어 임의 Host가 백엔드까지 전달된다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.hongikon.com;

    server_tokens off;

    # 제보 사진 업로드 상한. 앱은 업로드 전에 이미지를 줄이지만 원본이 올 때를 대비한다.
    client_max_body_size 10m;

    location / {
        limit_req zone=hongikon_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Spring(server.forward-headers-strategy=framework)이 원래 스킴·호스트를 알아야
        # 카카오 OAuth redirect-uri({baseUrl})가 https://api.hongikon.com 으로 만들어진다.
        # 클라이언트가 보낸 Host 대신 server_name 으로 고정한다 — Spring이 이 값으로 OAuth redirect-uri를 만든다.
        proxy_set_header Host              $server_name;
        proxy_set_header X-Real-IP         $remote_addr;
        # nginx가 유일한 프록시라 클라이언트가 보낸 X-Forwarded-For 는 버리고 실제 접속 IP로 덮어쓴다(IP 위조 방지).
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $server_name;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
