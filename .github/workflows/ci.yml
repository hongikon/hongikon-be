name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 의존성·래퍼 캐시. PR 에서는 캐시를 읽기만 하고 dev/main push 에서만 쓴다(기본 동작).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 테스트는 모두 test 프로필(src/test/resources/application-test.properties)의 H2 인메모리 DB 로 돈다.
      # 외부 DB·운영 환경변수·Secrets 를 넣지 않는다.
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
