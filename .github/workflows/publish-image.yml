name: Publish image

# dev·main 에 push 될 때마다 이미지를 만들어 ghcr.io 에 올린다. 배포는 하지 않는다(docs/ci-cd.md).
on:
  push:
    branches: [dev, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 테스트는 ci.yml 이 같은 push 에서 돌린다. 여기서는 jar 만 만든다.
      - name: Build jar
        run: ./gradlew build -x test --no-daemon

      # 로컬 전용 설정(.gitignore 대상)이 실수로 커밋돼 jar 에 들어가면 올리지 않는다.
      - name: Check jar has no local config
        run: |
          if unzip -l build/libs/hongmap-backend-0.0.1-SNAPSHOT.jar | grep -q 'application-local'; then
            echo "::error::jar 에 application-local.properties 가 들어 있습니다"
            exit 1
          fi

      - name: Compute image tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/hongikon-be"
          branch="${GITHUB_REF_NAME}"
          tags="${image}:sha-${GITHUB_SHA::7} ${image}:${branch}"
          if [[ "$branch" == "main" ]]; then
            tags="${tags} ${image}:latest"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          for t in $TAGS; do args+=(-t "$t"); done
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${args[@]}" .
          for t in $TAGS; do docker push "$t"; done
          echo "### 올린 이미지" >> "$GITHUB_STEP_SUMMARY"
          for t in $TAGS; do echo "- \`$t\`" >> "$GITHUB_STEP_SUMMARY"; done
