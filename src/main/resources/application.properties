spring.application.name=hongmap-backend
spring.jpa.hibernate.ddl-auto=validate

# 리버스 프록시(ngrok 등)가 보내는 X-Forwarded-* 헤더를 신뢰해서 원본 프로토콜/호스트를 인식
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hongmap}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Kakao OAuth2 client registration (secrets in application-local.properties)
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# App - deep link the browser redirects to after Kakao login success, and one-time code TTL
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:hongikon://auth/callback}
# 위 기본값 외에 로그인 진입 시 ?redirect_uri= 로 돌아갈 수 있는 주소(정확히 일치해야 함). 웹판 앱(/auth/callback)·웹 관리자(/admin)용.
# 로컬에서 관리자 화면을 띄울 땐 OAUTH2_ALLOWED_REDIRECT_URIS 에 http://localhost:8081/admin 을 더한다
# (운영 기본값에 localhost 를 넣지 않는다 — 1회용 코드가 운영 밖 주소로 나가지 않게).
app.oauth2.allowed-redirect-uris=${OAUTH2_ALLOWED_REDIRECT_URIS:https://hongikon.com/auth/callback,https://www.hongikon.com/auth/callback,https://hongikon.com/admin,https://www.hongikon.com/admin}
app.auth.exchange-code-ttl-seconds=${OAUTH2_CODE_TTL_SECONDS:60}

# Sign in with Apple (POST /auth/apple)
# identity token의 aud로 허용할 iOS 번들 ID(프로덕션·프리뷰·개발 빌드). 쉼표로 구분.
app.apple.client-ids=${APPLE_CLIENT_IDS:com.hongikon.app,com.hongikon.app.preview,com.hongikon.app.dev}
# 탈퇴 시 Apple 토큰 폐기용 키(Apple Developer > Keys > Sign in with Apple). 비워 두면 로그인은 되고 폐기만 건너뛴다(WARN 로그).
# 단 prod 프로필은 APPLE_CLIENT_IDS 가 비어 있지 않은데 이 키들이나 APPLE_TOKEN_ENC_KEY 가 없으면 기동하지 않는다.
# APPLE_PRIVATE_KEY는 .p8 파일 내용 전체(PEM). 한 줄로 넣을 땐 줄바꿈을 \n 으로 써도 된다.
app.apple.team-id=${APPLE_TEAM_ID:}
app.apple.key-id=${APPLE_KEY_ID:}
app.apple.private-key=${APPLE_PRIVATE_KEY:}
app.apple.keys-url=https://appleid.apple.com/auth/keys
app.apple.token-url=https://appleid.apple.com/auth/token
app.apple.revoke-url=https://appleid.apple.com/auth/revoke
# Apple refresh 토큰 저장 암호화 키(AES-256-GCM). 32바이트 Base64: `openssl rand -base64 32`. 비우면 Apple refresh 토큰을 저장하지 않는다.
# 바꾸면 기존 토큰은 읽을 수 없게 된다(다음 로그인 때 새로 저장됨).
app.apple.token-encryption-key=${APPLE_TOKEN_ENC_KEY:}
# 탈퇴 시 Apple 토큰 폐기가 실패한 건을 다시 시도하는 주기(매시 17분).
app.apple.revocation-retry-cron=${APPLE_REVOCATION_RETRY_CRON:0 17 * * * *}
app.apple.connect-timeout-ms=${APPLE_CONNECT_TIMEOUT_MS:5000}
app.apple.read-timeout-ms=${APPLE_READ_TIMEOUT_MS:10000}

# JWT
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

# GET /news 등 Pageable 목록 API의 size 상한(넘으면 이 값으로 맞춰진다). 기본 크기는 각 컨트롤러 @PageableDefault.
spring.data.web.pageable.max-page-size=50

# News crawler — 값은 나중에 조정 가능. 프론트 scripts/crawler/config.mjs 기본값 기준.
crawler.schedule.cron=${CRAWLER_CRON:0 0 * * * *}
crawler.page-size=${CRAWLER_PAGE_SIZE:50}
crawler.default-pages=${CRAWLER_DEFAULT_PAGES:2}
crawler.request-delay-ms=${CRAWLER_REQUEST_DELAY_MS:400}
crawler.max-retries=${CRAWLER_MAX_RETRIES:3}
crawler.timeout-ms=${CRAWLER_TIMEOUT_MS:15000}
crawler.user-agent=${CRAWLER_USER_AGENT:HongmapNewsBot/1.0 (student project)}

# Push — 새 소식 Expo 푸시(NewsPushDispatcher). 크롤링이 끝날 때 새 소식을 100건씩 묶어 발송한다.
push.enabled=${PUSH_ENABLED:true}
push.expo-url=${PUSH_EXPO_URL:https://exp.host/--/api/v2/push/send}
# Expo 계정에서 Enhanced Security for Push Notifications를 켰을 때만 필요. 비워 두면 인증 헤더 없이 보낸다.
push.expo-access-token=${PUSH_EXPO_ACCESS_TOKEN:}
push.connect-timeout-ms=${PUSH_CONNECT_TIMEOUT_MS:5000}
push.read-timeout-ms=${PUSH_READ_TIMEOUT_MS:15000}
# 작성일이 이 일수보다 오래된 새 소식은 푸시하지 않는다(첫 크롤링·게시판 추가 시 과거 글 푸시 폭탄 방지).
push.news-max-age-days=${PUSH_NEWS_MAX_AGE_DAYS:3}
# 캠퍼스 새 제보 알림(ReportPushDispatcher) 빈도 제한 — 한 유저는 이 분 안에 새 제보 푸시를 한 번만 받는다.
push.report-new-throttle-minutes=${PUSH_REPORT_NEW_THROTTLE_MINUTES:30}

# Report - 종료시각(endsAt) 상한(현재로부터 최대 N일), 신고 누적 자동 숨김 임계치
report.endsAt.maxDays=${REPORT_ENDS_AT_MAX_DAYS:7}
report.flag.threshold=${REPORT_FLAG_THRESHOLD:3}
