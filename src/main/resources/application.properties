spring.application.name=hongmap-backend
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hongmap}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Kakao OAuth2 client registration (secrets in application-local.properties)
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# App - deep link the browser redirects to after Kakao login success, and one-time code TTL
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:hongikon://auth/callback}
app.auth.exchange-code-ttl-seconds=${OAUTH2_CODE_TTL_SECONDS:60}

# JWT
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

# News crawler — 값은 나중에 조정 가능. 프론트 scripts/crawler/config.mjs 기본값 기준.
crawler.schedule.cron=${CRAWLER_CRON:0 0 * * * *}
crawler.page-size=${CRAWLER_PAGE_SIZE:50}
crawler.default-pages=${CRAWLER_DEFAULT_PAGES:2}
crawler.request-delay-ms=${CRAWLER_REQUEST_DELAY_MS:400}
crawler.max-retries=${CRAWLER_MAX_RETRIES:3}
crawler.timeout-ms=${CRAWLER_TIMEOUT_MS:15000}
crawler.user-agent=${CRAWLER_USER_AGENT:HongmapNewsBot/1.0 (student project)}
