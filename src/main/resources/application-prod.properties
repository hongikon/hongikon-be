# prod 프로필(`SPRING_PROFILES_ACTIVE=prod`, docs/worklog.md EC2 배포 기록 참고) 전용 설정.
# Swagger UI / OpenAPI 스키마가 인증 없이 공개돼 있으면 전체 API 표면(경로·파라미터·DTO 구조)이
# 그대로 노출된다 — SecurityConfig 의 /swagger-ui/**, /v3/api-docs/** permitAll 은 프로필 구분이
# 없어서 지금까지 운영 환경에서도 열려 있었다. 로컬/개발에선 계속 쓰되 운영에서만 끈다.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# 카카오 로그인 진행 중에만 쓰는 세션 쿠키(JSESSIONID). 운영은 HTTPS 뒤에서만 돌아가므로 Secure 를 붙여
# 평문 http 로 쿠키가 새지 않게 한다. SameSite=Lax 는 카카오 → api.hongikon.com 콜백(최상위 GET 이동)에는 쿠키가 실린다.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 로그인 대기 세션은 짧게 둔다(기본 30분).
server.servlet.session.timeout=10m
