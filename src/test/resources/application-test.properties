# 통합 테스트 전용 — MySQL 없이 H2(MySQL 모드) 인메모리 DB로 엔티티 기준 스키마를 만든다.
spring.datasource.url=jdbc:h2:mem:hongikon;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Apple refresh 토큰 암호화 키(테스트 전용 고정값)와 폐기 재시도 스케줄 끔.
app.apple.token-encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.apple.revocation-retry-cron=-
spring.security.oauth2.client.registration.kakao.client-id=test-client-id
spring.security.oauth2.client.registration.kakao.client-secret=test-client-secret
jwt.secret=test-secret-test-secret-test-secret-test-secret-0123456789
# 테스트 중 실제 홍익대 사이트를 크롤링하지 않도록 정기 실행을 끈다.
crawler.schedule.cron=-
# 모킹하지 않은 테스트(예: 제보 승인 → 비동기 제보 푸시)가 실제 Expo 서버를 부르지 않도록 닫힌 포트로 돌린다.
push.expo-url=http://127.0.0.1:9/--/api/v2/push/send
push.connect-timeout-ms=200
push.read-timeout-ms=200
# 승인 대기 리마인드 정기 실행 끔 — 테스트가 고정 Clock 으로 직접 부른다(AdminReportReminderTest).
push.admin-reminder-cron=-
# 탈퇴 기록 만료 정리 정기 실행 끔 — 테스트가 직접 부른다(WithdrawRetentionIntegrationTest).
app.withdraw-retention.purge-cron=-
